name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Stage
    runs-on: [self-hosted, linux, x64, moipone-pipeline]

    steps:
      - uses: actions/checkout@v6

      - name: Restore dependencies
        run: dotnet restore aspnet-core/Moipone.PublicSite.sln

      - name: Build
        run: dotnet build --no-restore --configuration Release aspnet-core/Moipone.PublicSite.sln

      - name: Publish
        run: dotnet publish aspnet-core/Moipone.PublicSite.sln --no-build --configuration Release --output ./publish

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: app
          path: ./publish

  test:
    name: Test Stage
    runs-on: [self-hosted, linux, x64, moipone-pipeline]
    needs: build

    steps:
      - uses: actions/checkout@v6
      - name: Restore dependencies
        run: dotnet restore aspnet-core/Moipone.PublicSite.sln
  
      - name: Run tests
        run: |
          cd aspnet-core
          dotnet test --verbosity normal
  
  db_update:
    name: Database Update
    runs-on: [self-hosted, linux, x64, moipone-pipeline]
    needs: [build, test]
    if: github.ref == 'refs/heads/main'

    env:
      ASPNETCORE_ENVIRONMENT: Production
      App__S3Prefix: ${{ secrets.APP__S3PREFIX }}
      App__CorsOrigins: ${{ secrets.APP__CORSORIGINS }}
      ConnectionStrings__Default: ${{ secrets.CONNECTIONSTRINGS__DEFAULT }}
      DOTNET_INSTALL_DIR: /home/ubuntu/.dotnet
    
    steps:
      - uses: actions/checkout@v6

      - name: Restore dependencies
        run: dotnet restore aspnet-core/Moipone.PublicSite.sln

      - name: Install EF Core CLI (pinned)
        run: dotnet tool install --global dotnet-ef --version 10.0.1

      - name: Update Database
        run: |
          cd aspnet-core/src/Moipone.PublicSite.EntityFrameworkCore
          dotnet ef database update \
            --startup-project ../Moipone.PublicSite.Web.Host

  upload_image:
    name: Upload Docker Image
    runs-on: ubuntu-latest
    needs: [build, test, db_update]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          cd aspnet-core
          docker build -f Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/moiponeps:latest .

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/moiponeps:latest
  
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build, test, db_update, upload_image]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Create SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Add EC2 to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e
            mkdir -p /home/${{ secrets.EC2_USER }}/moipone
            cd /home/${{ secrets.EC2_USER }}/moipone

            cat > .env << EOT
            ASPNETCORE_ENVIRONMENT=Production
            ConnectionStrings__Default=${{ secrets.CONNECTIONSTRINGS__DEFAULT }}
            App__S3Prefix=${{ secrets.APP__S3PREFIX }}
            App__CorsOrigins=${{ secrets.APP__CORSORIGINS }}
            Sentry__Dsn=${{ secrets.SENTRY__DSN }}
            Abp__RedisCache__ConnectionString=${{ secrets.ABP__REDISCACHE__CONNECTIONSTRING }}
            EOT

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/moiponeps:latest

            docker stop moiponeps || true
            docker rm moiponeps || true

            docker run -d \
              --name moiponeps \
              --restart unless-stopped \
              --env-file .env \
              -p 127.0.0.1:8080:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/moiponeps:latest
          EOF
