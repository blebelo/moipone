name: CI/CD Pipeline
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build Stage
    runs-on: [self-hosted, linux, x64, moipone-pipeline]

    steps:
      - uses: actions/checkout@v6

      - name: Restore dependencies
        run: dotnet restore aspnet-core/Moipone.PublicSite.sln

      - name: Build
        run: dotnet build --no-restore --configuration Release aspnet-core/Moipone.PublicSite.sln

      - name: Publish
        run: dotnet publish aspnet-core/Moipone.PublicSite.sln --no-build --configuration Release --output ./publish

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: app
          path: ./publish

  test:
    name: Test Stage
    runs-on: [self-hosted, linux, x64, moipone-pipeline]
    needs: build

    steps:
      - uses: actions/checkout@v6
      - name: Restore dependencies
        run: dotnet restore aspnet-core/Moipone.PublicSite.sln
  
      - name: Run tests
        run: |
          cd aspnet-core
          dotnet test --verbosity normal
  
  db_update:
    name: Database Update
    runs-on: [self-hosted, linux, x64, moipone-pipeline]
    needs: [build, test]
    if: github.ref == 'refs/heads/main'

    env:
      ASPNETCORE_ENVIRONMENT: Production
      App__S3Prefix: ${{ secrets.APP__S3PREFIX }}
      App__CorsOrigins: ${{ secrets.APP__CORSORIGINS }}
      ConnectionStrings__Default: ${{ secrets.CONNECTIONSTRINGS__DEFAULT }}
    
    steps:
      - uses: actions/checkout@v6

      - name: Restore dependencies
        run: dotnet restore aspnet-core/Moipone.PublicSite.sln

      - name: Update Database
        run: |
          cd aspnet-core/src/Moipone.PublicSite.EntityFrameworkCore
          dotnet ef database update 

  upload_image:
    name: Upload Docker Image
    runs-on: ubuntu-latest
    needs: [build, test, db_update]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          cd aspnet-core
          docker build -f Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/moiponeps:latest .

      - name: Push image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/moiponeps:latest
  
  deploy:
    name: Deploy DLL to EC2
    runs-on: [self-hosted, linux, x64, moipone-pipeline]
    needs: [build, test, db_update, upload_image]
    if: github.ref == 'refs/heads/main'
  
    steps:
      - name: Checkout
        uses: actions/checkout@v6
  
      - name: Publish app
        run: |
          dotnet publish src/Moipone.PublicSite.Web.Host/Moipone.PublicSite.Web.Host.csproj \
            -c Release \
            -o /home/ubuntu/moipone/publish
  
      - name: Restart service
        run: |
          sudo systemctl daemon-reload
          sudo systemctl restart moipone
          sudo systemctl status moipone --no-pager
          echo "Running System Startup"
  
      - name: Smoke test
        run: |
          curl -I http://127.0.0.1:8080 || true
